[bar.widgets]
capsule = true
center = [ "widget", "date", "bar" ]
concave_edge_corners = false
end = [
    "privacy",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
radius = 0
start = [ "workspaces", "cpu", "ram", "sysmon" ]

[control_center.media]
show_visualizer = false

[dock]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-4" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-4"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 732.0
    cy = 732.0
    output = "eDP-1"
    placement_height = 914.0
    placement_width = 1463.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "noctalia/timer", "thepunkoff/pomodoro" ]

[shell]
clipboard_enabled = false
clipboard_keep_from_closed_apps = false

[theme]
community_palette = "GitHub Dark"
source = "community"

[wallpaper]
directory = "/home/hamzah/nixos-config/hosts/starscream/home"

    [wallpaper.default]
    path = "/home/hamzah/nixos-config/hosts/starscream/home/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/hamzah/nixos-config/hosts/starscream/home/wallpaper.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/hamzah/nixos-config/hosts/starscream/home/wallpaper.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/hamzah/nixos-config/hosts/starscream/home/wallpaper.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/hamzah/nixos-config/hosts/starscream/home/wallpaper.jpg"

[widget.bar]
type = "noctalia/timer:bar"

[widget.cpu]
show_value = false

[widget.date]
format = "{:%a %d %b %l:%M:%S %P}"

[widget.network]
show_label = false

[widget.ram]
show_value = false

[widget.sysmon]
show_value = false
stat = "disk_used"

[widget.tray]
drawer = true

[widget.widget]
type = "thepunkoff/pomodoro:widget"
